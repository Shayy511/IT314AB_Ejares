name: Deploy Flutter Web to Lightsail
on:
  push:
    branches: [ feature/student-list ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --release
      
      # I-deploy sa Lightsail gamit ang SCP
      - name: Deploy to Lightsail
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "build/web/*."
          target: "/var/www/html/myapp" # Ang web directory ng iyong server
